name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Formatting check. The repo's .clang-format uses `Language: C`, which only
  # clang-format >=22 can parse (19/20/21 reject it), so we pin the wheel to 22.
  # The tree is kept formatted to this exact version; run `clang-format -i` with
  # clang-format 22 before pushing if this fails.
  # --------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pinned clang-format
        run: python -m pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          # Resolve the wheel's bundled binary via the SAME interpreter that
          # installed it; the runner's preinstalled /usr/bin/clang-format is
          # older and can't parse `Language: C`.
          CF="$(python -c 'import clang_format, os.path as p; print(p.join(p.dirname(clang_format.__file__), "data", "bin", "clang-format"))')"
          "$CF" --version
          files=$(find src include tests examples bench \
                  \( -name '*.c' -o -name '*.h' \))
          "$CF" --dry-run --Werror $files

  # --------------------------------------------------------------------------
  # Native build + ctest across compilers, SIMD backends, and OSes.
  #
  # warnings-as-errors (WAE) is enabled only where the tree is actually -Werror
  # clean. clang's -Wcast-align flags the unaligned-load SIMD intrinsic casts
  # (_mm256_loadu_si256 etc.) that gcc accepts, so clang+SIMD and the apple-clang
  # neon build run with WAE OFF. The macOS job runs the portable suite plus the
  # pty canary (test_pty_lifecycle); the remaining pty tests are Apple-gated
  # pending the macOS pty-test parity item in ROADMAP "Known blockers".
  # --------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-scalar,   os: ubuntu-latest, cc: gcc,   simd: scalar, wae: 'ON',  run_tests: true,  extra: '' }
          - { name: linux-gcc-avx2,     os: ubuntu-latest, cc: gcc,   simd: avx2,   wae: 'ON',  run_tests: true,  extra: '' }
          # AVX-512 is not guaranteed at runtime on hosted runners — compile only.
          - { name: linux-gcc-avx512,   os: ubuntu-latest, cc: gcc,   simd: avx512, wae: 'ON',  run_tests: false, extra: '' }
          - { name: linux-clang-scalar, os: ubuntu-latest, cc: clang, simd: scalar, wae: 'ON',  run_tests: true,  extra: '' }
          - { name: linux-clang-avx2,   os: ubuntu-latest, cc: clang, simd: avx2,   wae: 'OFF', run_tests: true,  extra: '' }
          # macOS arm64 / neon — runs the portable suite (examples/bench stay off).
          - { name: macos-clang-neon,   os: macos-latest,  cc: clang, simd: auto,   wae: 'OFF', run_tests: true,  extra: '-DLIBTERM_BUILD_EXAMPLES=OFF -DLIBTERM_BUILD_BENCH=OFF' }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTERM_SIMD=${{ matrix.simd }} \
            -DLIBTERM_WARNINGS_AS_ERRORS=${{ matrix.wae }} \
            ${{ matrix.extra }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        if: ${{ matrix.run_tests }}
        run: ctest --test-dir build --output-on-failure

  # --------------------------------------------------------------------------
  # Compile-check the Windows code path from Linux via the MinGW-w64 toolchain
  # (cross binaries can't be run without wine — this verifies they build).
  #
  # Native MSVC is intentionally not built here: the library currently fails to
  # compile under MSVC (winnt.h "No Target Architecture" out of errors.c), a
  # pre-existing portability issue separate from CI. MinGW covers the Win32 path.
  # --------------------------------------------------------------------------
  build-mingw:
    name: windows-mingw-cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Configure
        run: |
          cmake -S . -B build-mingw \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64.cmake \
            -DLIBTERM_BUILD_TESTS=OFF \
            -DLIBTERM_BUILD_EXAMPLES=OFF \
            -DLIBTERM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build-mingw --parallel

  # --------------------------------------------------------------------------
  # Install/export wiring: stage-install + find_package(Libterm) consumer,
  # in both default (umbrella -> static) and shared-only configurations.
  # --------------------------------------------------------------------------
  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Smoke-test install + find_package
        run: bash tests/smoke_install.sh .

  # --------------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer on the full test suite.
  # --------------------------------------------------------------------------
  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Configure
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  # --------------------------------------------------------------------------
  # Cross-compile each scalable/foreign-ISA SIMD backend and run ctest under
  # QEMU (the toolchain files wire CMAKE_CROSSCOMPILING_EMULATOR, so ctest runs
  # the binaries transparently). The cross binutils provide the per-arch objdump
  # that test_simd_emitted uses to assert real SIMD instructions were emitted.
  #
  # rvv runs WAE OFF: gcc's -Wcast-align flags the RVV intrinsic casts.
  # --------------------------------------------------------------------------
  cross-simd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: aarch64-neon, toolchain: aarch64-qemu.cmake, simd: neon, wae: 'ON',  pkgs: 'gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user' }
          - { name: aarch64-sve,  toolchain: aarch64-qemu.cmake, simd: sve,  wae: 'ON',  pkgs: 'gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user' }
          - { name: riscv64-rvv,  toolchain: riscv64-qemu.cmake, simd: rvv,  wae: 'OFF', pkgs: 'gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user' }
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + QEMU
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Configure
        run: |
          cmake -S . -B build-cross \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/${{ matrix.toolchain }} \
            -DLIBTERM_SIMD=${{ matrix.simd }} \
            -DLIBTERM_WARNINGS_AS_ERRORS=${{ matrix.wae }} \
            -DLIBTERM_BUILD_EXAMPLES=OFF \
            -DLIBTERM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build-cross --parallel
      - name: Test (under QEMU)
        run: ctest --test-dir build-cross --output-on-failure

  # --------------------------------------------------------------------------
  # Static analysis: clang static analyzer (clang-analyzer-*) over the portable
  # code. The arch-specific intrinsics under src/intrinsics/ are excluded — they
  # are compiled for non-host ISAs and clang-tidy cannot parse them on the host.
  # Check set lives in .clang-tidy.
  # --------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Configure (export compile_commands.json)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy
        run: |
          files=$(find src/shared src/platform/posix src/lib -name '*.c')
          clang-tidy -p build --warnings-as-errors='*' $files
